# W&B sweep definition for Agri fruiting finetune.
#
# Usage (from repo root, after `source setup.sh`):
#   wandb sweep conf/sweep/agri_fruiting.yaml
#   wandb agent <entity>/<project>/<sweep_id>

program: src/sweep_train.py
command:
  - ${env}
  - python
  - -m
  - src.sweep_train
method: bayes
metric:
  name: val/mae_count
  goal: minimize

parameters:
  pooled:
    values: [false, true]

  loss_type:
    values: [mae, entropy]

  learning_rate:
    distribution: log_uniform_values
    min: 1.0e-5
    max: 1.0e-3

  dropout:
    values: [0.05, 0.1, 0.2]

  weight_decay:
    values: [0.001, 0.01, 0.05]

  freeze_embeddings:
    values: [true, false]

  batch_size:
    values: [4, 8]

  accumulate_grad_batches:
    values: [1, 2, 4]

early_terminate:
  type: hyperband
  min_iter: 100
  eta: 2
  s: 3
