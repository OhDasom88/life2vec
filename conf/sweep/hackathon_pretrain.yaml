# W&B grid sweep for Hackathon greenhouse MLM pretrain.
#
# Usage:
#   source setup.local.sh
#   wandb sweep conf/sweep/hackathon_pretrain.yaml
#   wandb agent dasom-oh/Berry2Vec/<sweep_id>

project: Berry2Vec
entity: dasom-oh
program: src/sweep_pretrain_hackathon.py
command:
  - ${env}
  - /home/dasom/miniconda3/envs/life2vec/bin/python
  - -m
  - src.sweep_pretrain_hackathon
method: grid
metric:
  name: val/pretrain_score
  goal: maximize

parameters:
  learning_rate:
    values: [0.001, 0.004, 0.01]

  mlm_weight:
    values: [0.7, 0.8, 0.9]

  dropout:
    values: [0.05, 0.1, 0.15]

  weight_decay:
    values: [0.001, 0.01]

  batch_size:
    values: [16]
