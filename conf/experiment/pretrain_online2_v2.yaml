# @package _global_
defaults:
  - /datamodule: online2_v2
  - /trainer: pretrain
  - /callbacks

version: 2.0-transductive
implementation: online2_v2
comments: "Online2 V2 transductive public pretraining"
name: online2_v2_pretraining
model_name: l2v
seed: 2023
stage: pre_training
ckpt_path: null

model:
  _target_: src.transformer.models.TransformerEncoder
  _convert_: all
  hparams:
    batch_size: ${datamodule.batch_size}
    max_length: ${datamodule.task.max_length}
    hidden_size: 256
    hidden_ff: 1024
    hidden_act: swish
    n_encoders: 4
    n_heads: 8
    n_local: 4
    local_window_size: 32
    norm_type: rezero
    att_dropout: 0.1
    fw_dropout: 0.1
    dc_dropout: 0.1
    emb_dropout: 0.1
    parametrize_emb: false
    norm_input_emb: false
    norm_output_emb: true
    weight_tying: wt
    training_task: ${datamodule.task.name}
    experiment_name: ${name}_${model_name}
    experiment_version: ${version}
    attention_type: performer
    multihead_dc: false
    num_random_features: 128
    learning_rate: 5.e-4
    weight_decay: 0.01
    beta1: 0.9
    beta2: 0.999
    cls_num_targs: 3
    epsilon: 1.e-6
    stage: ${stage}
    implementation: ${implementation}
    version: ${version}
    vocab_size: ${oc.env:ONLINE2_V2_VOCAB_SIZE,876}

trainer:
  accelerator: auto
  devices: 1
  precision: 16-mixed
  min_epochs: 1
  max_epochs: 3
  val_check_interval: 0.25
  accumulate_grad_batches: ${oc.env:ONLINE2_V2_GRAD_ACCUM,1}
  gradient_clip_val: 1.0
  enable_checkpointing: true
  default_root_dir: ${oc.env:ONLINE2_V2_RUN_DIR,outputs/online2/v2_runs}
