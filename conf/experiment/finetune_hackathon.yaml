# @package _global_

defaults:
  - /datamodule: hackathon_cls_set
  - /trainer: eos
  - /callbacks

version: 1.0
implementation: hackathon
comments: "Hackathon binary CLS finetune (survival-style)"
name: hackathon_cls
model_name: l2v

seed: 2023
stage: finetuning
pretrained_model_path: none
asym_penalty: 0.5
ckpt_path: null

model:
  _target_: src.transformer.cls_model.Transformer_CLS
  _convert_: all
  hparams:
    seed: ${seed}
    vocab_size: 570
    batch_size: ${datamodule.batch_size}
    max_length: ${datamodule.task.max_length}
    hidden_size: 128
    hidden_ff: 512
    hidden_act: swish
    n_encoders: 2
    n_heads: 4
    n_local: 3
    local_window_size: 16
    norm_type: rezero
    att_dropout: 0.1
    fw_dropout: 0.1
    dc_dropout: 0.1
    emb_dropout: 0.1
    parametrize_emb: false
    norm_input_emb: false
    training_task: ${datamodule.task.name}
    experiment_name: ${name}_${model_name}
    experiment_version: ${version}
    attention_type: performer
    multihead_dc: false
    num_random_features: 64
    optimizer_type: adamw
    learning_rate: 5.e-4
    weight_decay: 1.e-2
    weight_decay_dc: 1.e-3
    beta1: 0.9
    beta2: 0.999
    layer_lr_decay: 0.95
    lr_gamma: 0.8
    epsilon: 1.e-8
    freeze_embeddings: true
    freeze_positions: false
    num_targets: 2
    loss_type: asymmetric
    pos_weight: 0.4
    asym_penalty: ${asym_penalty}
    asym_alpha: 0.025
    asym_beta: 1.0
    pooled: false
    num_pooled_sep: ${datamodule.task.num_pooled_sep}
    pretrained_model_path: ${pretrained_model_path}
    stage: ${stage}
    implementation: ${implementation}
    version: ${version}

trainer:
  accelerator: gpu
  devices: [0]
  num_sanity_val_steps: 0
  min_epochs: 5
  max_epochs: 100
  accumulate_grad_batches: 2
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  callbacks:
    - ${callbacks.checkpoint_cls}
    - ${callbacks.early_stopping}
    - ${callbacks.lr_monitor}
    - ${callbacks.silence_warnings}
    - ${callbacks.reseed_dataloader}
    - ${callbacks.track_ids}
    - ${callbacks.calculate_risk}
