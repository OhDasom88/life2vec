# @package _global_
# Base config for W&B grid sweeps on Agri fruiting finetune (overfit sanity).
# All 40 plant sequences are used for train/val/test (memorization check).
# Pretrained encoder weights come from W&B pretrain sweep ugf1f2ld.

defaults:
  - /datamodule: agri_fruiting_overfit_set
  - /trainer: eos
  - /callbacks

version: sweep
implementation: agri
comments: "W&B grid sweep: overfit sanity (40 samples, train=val=test) with ugf1f2ld pretrain"
name: fruiting
model_name: l2v

seed: 2023
stage: finetuning
pretrained_model_path: /weights/agri/mlm/pre_training/sweep_s5fcufv0.pth
ckpt_path: null

model:
  _target_: src.transformer.agri_fruiting_model.Transformer_AgriFruiting
  _convert_: all
  hparams:
    seed: ${seed}
    vocab_size: 357
    batch_size: ${datamodule.batch_size}
    max_length: ${datamodule.task.max_length}
    hidden_size: 128
    hidden_ff: 512
    hidden_act: swish
    n_encoders: 2
    n_heads: 4
    n_local: 3
    local_window_size: 16
    norm_type: rezero
    att_dropout: 0.1
    fw_dropout: 0.1
    dc_dropout: 0.1
    emb_dropout: 0.1
    parametrize_emb: false
    norm_input_emb: false
    norm_output_emb: true
    weight_tying: wt
    training_task: ${datamodule.task.name}
    experiment_name: ${name}_${model_name}
    experiment_version: ${version}
    attention_type: performer
    multihead_dc: false
    num_random_features: 64
    optimizer_type: adamw
    learning_rate: 5.e-4
    weight_decay: 1.e-2
    weight_decay_dc: 1.e-3
    beta1: 0.9
    beta2: 0.999
    layer_lr_decay: 0.95
    lr_gamma: 0.8
    epsilon: 1.e-8
    freeze_embeddings: true
    freeze_positions: false
    num_targets: 6
    loss_type: asymmetric
    asym_alpha: 1.0
    asym_beta: 1.5
    auto_class_weights: true
    pooled: true
    redraw_projections: true
    num_pooled_sep: ${datamodule.task.num_pooled_sep}
    pretrained_model_path: ${pretrained_model_path}
    stage: ${stage}
    implementation: ${implementation}
    version: ${version}
    save_path: ../predictions/${implementation}/fruiting/l2v/${version}

trainer:
  accelerator: gpu
  devices: [0]
  num_sanity_val_steps: 0
  min_epochs: 20
  max_epochs: 300
  accumulate_grad_batches: 2
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  callbacks:
    - ${callbacks.checkpoint_fruiting_sweep}
    - ${callbacks.early_stopping_fruiting_sweep}
    - ${callbacks.lr_monitor}
    - ${callbacks.silence_warnings}
